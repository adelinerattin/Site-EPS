<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 660">
  <!-- Illustration du hero : bloc diagonal bleu marine avec bande jaune,
       et 3 silhouettes de sportifs (course, saut au basket, gainage)
       dessinees en pictogramme (traits epais). Purement vectoriel :
       aucune photo, donc librement modifiable ici. Canvas volontairement
       plus haut que large (480x660) pour que le bloc marine descende
       jusqu'au bas de la zone hero (bouton "Decouvrir mes ressources"
       inclus) sur tablette/ordinateur. -->

  <!-- Bloc diagonal bleu marine (la diagonale atteint deja le bord
       gauche a y=560 : au-dela, la forme reste simplement pleine
       largeur jusqu'au nouveau bas du canevas) -->
  <polygon points="260,0 480,0 480,660 0,660" fill="#0a1f44" />

  <!-- Bande jaune diagonale (prolongee dans le meme axe) -->
  <polygon points="-64,652 242,-8 284,11 -22,671" fill="#ffd23f" />

  <!-- Trame de points (zone claire, coin haut-gauche) -->
  <g fill="#0a1f44" opacity="0.18">
    <circle cx="34" cy="40" r="3" /><circle cx="54" cy="40" r="3" /><circle cx="74" cy="40" r="3" /><circle cx="94" cy="40" r="3" />
    <circle cx="34" cy="60" r="3" /><circle cx="54" cy="60" r="3" /><circle cx="74" cy="60" r="3" /><circle cx="94" cy="60" r="3" />
    <circle cx="34" cy="80" r="3" /><circle cx="54" cy="80" r="3" /><circle cx="74" cy="80" r="3" /><circle cx="94" cy="80" r="3" />
  </g>

  <!-- Silhouette 1 : joueur en suspension, ballon leve -->
  <g transform="translate(365,150) scale(1.15)" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-98" r="13" fill="#ffffff" stroke="none" />
    <path d="M0 -86 L-4 -30" />
    <path d="M-2 -78 L20 -100 L38 -118" stroke-width="12" />
    <circle cx="46" cy="-128" r="14" fill="#ffd23f" stroke="none" />
    <path d="M-2 -78 L-30 -60" stroke-width="12" />
    <path d="M-4 -30 L14 -8 L6 18" stroke-width="13" />
    <path d="M-4 -30 L-22 -6 L-12 20" stroke-width="13" />
  </g>

  <!-- Silhouette 2 : coureuse, foulee lancee -->
  <g transform="translate(300,340) scale(1.15)" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="4" cy="-96" r="13" fill="#ffffff" stroke="none" />
    <path d="M4 -84 L-4 -28" />
    <path d="M0 -72 L-32 -88" stroke-width="12" />
    <path d="M2 -72 L26 -46" stroke-width="12" />
    <path d="M-4 -28 L28 -18 L18 22" stroke-width="13" />
    <path d="M-4 -28 L-30 10 L-40 38" stroke-width="13" />
  </g>

  <!-- Silhouette 3 : gainage (planche) -->
  <g transform="translate(300,568) scale(1.15)" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-64" cy="-6" r="12" fill="#ffffff" stroke="none" />
    <path d="M-52 -4 L30 6" stroke-width="18" />
    <path d="M-46 -2 L-46 34" stroke-width="12" />
    <path d="M24 5 L72 27" stroke-width="16" />
  </g>

  <!-- Pictogrammes secondaires, en arriere-plan des silhouettes, pour
       remplir l'espace sans distraire du sujet principal. -->

  <!-- Boussole (course d'orientation) -->
  <g transform="translate(305,85)" stroke="#ffd23f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <circle r="22" />
    <path d="M0 -22 L0 -15 M0 22 L0 15 M-22 0 L-15 0 M22 0 L15 0" />
    <path d="M0 -13 L6 0 L0 13 L-6 0 Z" fill="#ffd23f" stroke="none" />
  </g>

  <!-- Chronometre -->
  <g transform="translate(437,300)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <circle cy="4" r="19" />
    <path d="M0 4 L0 -9" />
    <path d="M0 4 L10 9" />
    <path d="M-7 -21 h14" />
    <path d="M0 -21 v-6" />
  </g>

  <!-- Ballon rond (handball / basket) -->
  <g transform="translate(418,510)" stroke="#ffd23f" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
    <circle r="17" />
    <path d="M-17 0 A17 17 0 0 0 17 0" />
    <path d="M-12 -12 A19 19 0 0 1 12 12" />
  </g>

  <!-- Ballon ovale (rugby) -->
  <g transform="translate(432,620) rotate(28)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <ellipse rx="21" ry="12" />
    <path d="M-15 0 h30 M-6 -5 v10 M6 -5 v10" />
  </g>

  <!-- Petit ballon, cote clair (echo discret du motif) -->
  <g transform="translate(60,300)" stroke="#0a1f44" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.15">
    <circle r="20" />
    <path d="M-20 0 A20 20 0 0 0 20 0" />
    <path d="M-14 -14 A22 22 0 0 1 14 14" />
  </g>

  <!-- Raquettes croisees (tennis de table) -->
  <g transform="translate(452,42)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <ellipse rx="14" ry="8" transform="rotate(35)" />
    <ellipse rx="14" ry="8" transform="rotate(-35)" />
    <circle cx="0" cy="-17" r="3.5" fill="#ffd23f" stroke="none" />
  </g>

  <!-- Frisbee (ultimate) -->
  <g transform="translate(448,215) rotate(-10)" stroke="#ffd23f" stroke-width="3" fill="none" opacity="0.85">
    <ellipse rx="20" ry="7" />
    <ellipse rx="11" ry="4" />
  </g>

  <!-- Haltere (force) -->
  <g transform="translate(195,250)" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M-18 0 h36" />
    <path d="M-22 -9 v18 M-27 -6 v12" />
    <path d="M22 -9 v18 M27 -6 v12" />
  </g>

  <!-- Poignee de main (entraide, solidarite) -->
  <g transform="translate(150,515)" stroke="#ffd23f" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M-26 -4 L-5 3" />
    <path d="M26 -4 L5 3" />
    <circle cx="0" cy="3" r="6" fill="#ffd23f" stroke="none" />
  </g>

  <!-- Livre ouvert -->
  <g transform="translate(450,562)" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M0 -12 L-19 -8 L-19 10 L0 6 L19 10 L19 -8 Z" />
    <path d="M0 -12 L0 6" />
    <path d="M-14 -4 L-5 -6 M-14 1 L-5 -1" stroke-width="1.8" opacity="0.7" />
    <path d="M14 -4 L5 -6 M14 1 L5 -1" stroke-width="1.8" opacity="0.7" />
  </g>

  <!-- Calendrier -->
  <g transform="translate(120,618)" stroke="#ffd23f" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <rect x="-16" y="-13" width="32" height="28" rx="4" />
    <path d="M-16 -4 h32" />
    <path d="M-8 -17 v8 M8 -17 v8" />
    <circle cx="-8" cy="5" r="1.6" fill="#ffd23f" stroke="none" />
    <circle cx="0" cy="5" r="1.6" fill="#ffd23f" stroke="none" />
    <circle cx="8" cy="5" r="1.6" fill="#ffd23f" stroke="none" />
  </g>

  <!-- Mail (enveloppe) -->
  <g transform="translate(258,633)" stroke="#ffffff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <rect x="-17" y="-11" width="34" height="22" rx="3" />
    <path d="M-17 -9 L0 4 L17 -9" />
  </g>
</svg>

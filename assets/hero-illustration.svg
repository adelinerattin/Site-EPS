<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560">
  <!-- Illustration du hero : bloc diagonal bleu marine avec bande jaune,
       et 3 silhouettes de sportifs (course, saut au basket, gainage)
       dessinees en pictogramme (traits epais). Purement vectoriel :
       aucune photo, donc librement modifiable ici. -->

  <!-- Bloc diagonal bleu marine -->
  <polygon points="260,0 480,0 480,560 0,560" fill="#0a1f44" />

  <!-- Bande jaune diagonale -->
  <polygon points="-18,552 242,-8 284,11 24,571" fill="#ffd23f" />

  <!-- Trame de points (zone claire, coin haut-gauche) -->
  <g fill="#0a1f44" opacity="0.18">
    <circle cx="34" cy="40" r="3" /><circle cx="54" cy="40" r="3" /><circle cx="74" cy="40" r="3" /><circle cx="94" cy="40" r="3" />
    <circle cx="34" cy="60" r="3" /><circle cx="54" cy="60" r="3" /><circle cx="74" cy="60" r="3" /><circle cx="94" cy="60" r="3" />
    <circle cx="34" cy="80" r="3" /><circle cx="54" cy="80" r="3" /><circle cx="74" cy="80" r="3" /><circle cx="94" cy="80" r="3" />
  </g>

  <!-- Silhouette 1 : joueur en suspension, ballon leve -->
  <g transform="translate(365,150) scale(1.15)" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-98" r="13" fill="#ffffff" stroke="none" />
    <path d="M0 -86 L-4 -30" />
    <path d="M-2 -78 L20 -100 L38 -118" stroke-width="12" />
    <circle cx="46" cy="-128" r="14" fill="#ffd23f" stroke="none" />
    <path d="M-2 -78 L-30 -60" stroke-width="12" />
    <path d="M-4 -30 L14 -8 L6 18" stroke-width="13" />
    <path d="M-4 -30 L-22 -6 L-12 20" stroke-width="13" />
  </g>

  <!-- Silhouette 2 : coureuse, foulee lancee -->
  <g transform="translate(300,340) scale(1.15)" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="4" cy="-96" r="13" fill="#ffffff" stroke="none" />
    <path d="M4 -84 L-4 -28" />
    <path d="M0 -72 L-32 -88" stroke-width="12" />
    <path d="M2 -72 L26 -46" stroke-width="12" />
    <path d="M-4 -28 L28 -18 L18 22" stroke-width="13" />
    <path d="M-4 -28 L-30 10 L-40 38" stroke-width="13" />
  </g>

  <!-- Silhouette 3 : gainage (planche) -->
  <g transform="translate(300,468) scale(1.15)" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-64" cy="-6" r="12" fill="#ffffff" stroke="none" />
    <path d="M-52 -4 L30 6" stroke-width="18" />
    <path d="M-46 -2 L-46 34" stroke-width="12" />
    <path d="M24 5 L72 27" stroke-width="16" />
  </g>

  <!-- Pictogrammes secondaires, en arriere-plan des silhouettes, pour
       remplir l'espace sans distraire du sujet principal. -->

  <!-- Boussole (course d'orientation) -->
  <g transform="translate(305,85)" stroke="#ffd23f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <circle r="22" />
    <path d="M0 -22 L0 -15 M0 22 L0 15 M-22 0 L-15 0 M22 0 L15 0" />
    <path d="M0 -13 L6 0 L0 13 L-6 0 Z" fill="#ffd23f" stroke="none" />
  </g>

  <!-- Chronometre -->
  <g transform="translate(437,300)" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <circle cy="4" r="19" />
    <path d="M0 4 L0 -9" />
    <path d="M0 4 L10 9" />
    <path d="M-7 -21 h14" />
    <path d="M0 -21 v-6" />
  </g>

  <!-- Ballon rond (handball / basket) -->
  <g transform="translate(418,410)" stroke="#ffd23f" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
    <circle r="17" />
    <path d="M-17 0 A17 17 0 0 0 17 0" />
    <path d="M-12 -12 A19 19 0 0 1 12 12" />
  </g>

  <!-- Ballon ovale (rugby) -->
  <g transform="translate(432,520) rotate(28)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
    <ellipse rx="21" ry="12" />
    <path d="M-15 0 h30 M-6 -5 v10 M6 -5 v10" />
  </g>

  <!-- Petit ballon, cote clair (echo discret du motif) -->
  <g transform="translate(60,300)" stroke="#0a1f44" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.15">
    <circle r="20" />
    <path d="M-20 0 A20 20 0 0 0 20 0" />
    <path d="M-14 -14 A22 22 0 0 1 14 14" />
  </g>
</svg>
